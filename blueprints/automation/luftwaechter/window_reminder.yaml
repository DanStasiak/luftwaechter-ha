blueprint:
  name: Luftwächter - window open too long (phone and speakers)
  description: >
    Sends a push notification to your phone and optionally speaks on speakers when Luftwächter reminds you that a
    window has been open too long (first wait, repeat, cold outside and active hours are set in the integration's
    options). The phone notification has two buttons: "Snooze" and "Skip until closed". Replaces a hand-built
    "window open too long" automation. Note: the standard Home Assistant companion app push is relayed through the
    Google or Apple push service.
  domain: automation
  author: Dan Stasiak
  source_url: https://github.com/DanStasiak/luftwaechter-ha/blob/main/blueprints/automation/luftwaechter/window_reminder.yaml
  homeassistant:
    min_version: 2025.10.0
  input:
    notify_service:
      name: Phone notify service
      description: The notify action of your phone, for example notify.mobile_app_my_phone. Leave empty to skip the push.
      default: ""
      selector:
        text:
    snooze_minutes:
      name: Snooze length (minutes)
      default: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    tts_entity:
      name: Text to speech engine
      description: Optional. Pick a TTS engine and at least one speaker to also speak the reminder.
      default: ""
      selector:
        entity:
          domain: tts
    speakers:
      name: Speakers
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true
    speak_switch:
      name: Voice on/off switch (optional)
      description: Pick an input_boolean or switch. The voice is only spoken while it is on; the phone push is not affected. Leave empty for always on.
      default: ""
      selector:
        entity:
          domain:
            - input_boolean
            - switch
    speak_presence:
      name: Speak only while someone is home (optional)
      description: Pick a person, a group or a binary sensor. The voice is only spoken while it is home or on, so the speaker stays quiet in an empty house. The phone push is not affected. Leave empty for always.
      default: ""
      selector:
        entity:
          domain:
            - person
            - group
            - binary_sensor
    open_panel:
      name: Tapping the push opens the Luftwächter panel
      description: When on, a tap on the phone notification opens the sidebar panel at the room of the window (companion app).
      default: false
      selector:
        boolean:
    speak_text:
      name: Spoken text
      description: Use {{ message }}, {{ room }}, {{ window }} and {{ minutes }}.
      default: "{{ message }}"
      selector:
        text:

mode: queued
max: 5
max_exceeded: silent

triggers:
  - trigger: event
    event_type: luftwaechter_reminder
    id: remind
  - trigger: event
    event_type: mobile_app_notification_action
    id: action

variables:
  notify_service: !input notify_service
  tts_entity: !input tts_entity
  speakers: !input speakers
  speak_switch: !input speak_switch
  speak_presence: !input speak_presence
  open_panel: !input open_panel
  snooze_minutes: !input snooze_minutes
  message: "{{ trigger.event.data.message | default('') }}"
  room: "{{ trigger.event.data.room | default('') }}"
  room_key: "{{ trigger.event.data.room_key | default('') }}"
  window: "{{ trigger.event.data.window | default('') }}"
  minutes: "{{ trigger.event.data.minutes_open | default(0) }}"
  entity: "{{ trigger.event.data.entity_id | default('') }}"
  speak_text: !input speak_text
  act: "{{ trigger.event.data.action | default('') if trigger.id == 'action' else '' }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: remind
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_service | length > 0 }}"
            then:
              - action: "{{ notify_service }}"
                data:
                  title: "{{ room }}"
                  message: "{{ message }}"
                  data:
                    tag: "luftwaechter_{{ entity }}"
                    url: "{{ '/luftwaechter#room=' ~ room_key if open_panel and room_key | length > 0 else '' }}"
                    clickAction: "{{ '/luftwaechter#room=' ~ room_key if open_panel and room_key | length > 0 else '' }}"
                    actions:
                      - action: "LW_SNOOZE|{{ entity }}"
                        title: "Snooze {{ snooze_minutes | int }} min"
                      - action: "LW_SKIP|{{ entity }}"
                        title: "Skip until closed"
          - if:
              - condition: template
                value_template: "{{ tts_entity | length > 0 and speakers | length > 0 and (speak_switch | length == 0 or is_state(speak_switch, 'on')) and (speak_presence | length == 0 or is_state(speak_presence, ['home', 'on'])) }}"
            then:
              - action: tts.speak
                target:
                  entity_id: "{{ tts_entity }}"
                data:
                  media_player_entity_id: "{{ speakers }}"
                  message: "{{ speak_text }}"
      - conditions:
          - condition: trigger
            id: action
          - condition: template
            value_template: "{{ act.startswith('LW_SNOOZE|') }}"
        sequence:
          - action: luftwaechter.snooze
            data:
              entity_id: "{{ act.split('|')[1] }}"
              minutes: "{{ snooze_minutes | int }}"
      - conditions:
          - condition: trigger
            id: action
          - condition: template
            value_template: "{{ act.startswith('LW_SKIP|') }}"
        sequence:
          - action: luftwaechter.skip_until_closed
            data:
              entity_id: "{{ act.split('|')[1] }}"
