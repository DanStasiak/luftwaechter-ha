blueprint:
  name: Luftwächter - tell me when a sensor goes quiet
  description: >
    Runs your actions when a room's air sensor has stopped reporting (for example an
    empty battery) for the time you choose. In your actions you can use the variables
    `rooms` (a list of room names) and `count`.
  domain: automation
  author: Dan Stasiak
  source_url: https://github.com/DanStasiak/luftwaechter-ha/blob/main/blueprints/automation/luftwaechter/sensor_problem.yaml
  homeassistant:
    min_version: 2025.10.0
  input:
    problem_sensor:
      name: Sensor problem
      description: The binary sensor "Luftwächter Sensor problem".
      selector:
        entity:
          filter:
            - integration: luftwaechter
              domain: binary_sensor
    wait_minutes:
      name: Wait before telling me (minutes)
      description: The problem must last this long, so a short Wi-Fi gap is ignored.
      default: 30
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    actions:
      name: Actions
      description: What to do, for example send a notification. Use {{ rooms }} and {{ count }} in texts.
      default: []
      selector:
        action:

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input problem_sensor
    to: "on"
    for:
      minutes: !input wait_minutes

variables:
  rooms: "{{ state_attr(trigger.entity_id, 'rooms') or [] }}"
  count: "{{ state_attr(trigger.entity_id, 'count') | int(0) }}"

actions: !input actions
