name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    name: Marketplace (HACS) repository check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
  lint:
    name: Lint (ruff, JavaScript syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components
      - run: node --check custom_components/luftwaechter/frontend/luftwaechter-panel.js
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component home-assistant-frontend playwright
      - run: playwright install --with-deps chromium
      - run: pytest -q
      - run: python tests/panel.spec.py shots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots
