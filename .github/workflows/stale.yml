name: Stale issues
on:
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          exempt-issue-labels: "pinned,security,enhancement,help wanted"
          stale-issue-message: >
            This issue has had no activity for 60 days. If it still happens with the newest version, please add a comment
            and it stays open; otherwise it is closed in 14 days. Thank you!
          close-issue-message: Closed because there was no answer. Feel free to open it again with new details.
          days-before-pr-stale: -1
          days-before-pr-close: -1
